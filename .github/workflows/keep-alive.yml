name: 保活 Render 服务

on:
  schedule:
    # 用不规则的时间点，模拟真人访问（避免机器特征）
    - cron: '3,19,37,52 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: 随机延迟后 Ping
        run: |
          # 随机等待 0-120 秒，让每次请求时间不完全固定
          DELAY=$((RANDOM % 120))
          echo "⏰ $(date '+%Y-%m-%d %H:%M:%S') 随机延迟 ${DELAY}s..."
          sleep $DELAY
          
          RENDER_URL="https://data-pipeline-654.onrender.com/"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$RENDER_URL" || echo "000")
          
          if [ "$STATUS" = "200" ]; then
            echo "✅ Render 正常 (HTTP $STATUS)"
          elif [ "$STATUS" = "000" ]; then
            echo "⚠️ 无响应，等待唤醒后重试..."
            sleep 60
            STATUS2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$RENDER_URL" || echo "000")
            echo "🔄 重试: HTTP $STATUS2"
          else
            echo "⚠️ HTTP $STATUS"
          fi
